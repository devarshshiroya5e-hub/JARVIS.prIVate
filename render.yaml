services:
  - type: web
    name: jarvis-private
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENROUTER_MODEL
        value: openrouter/free
